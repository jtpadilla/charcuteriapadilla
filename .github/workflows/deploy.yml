name: Publica en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # La maqueta es estática: se publica tal cual, sin compilar. Solo se marcan con el commit los
      # enlaces a datos.js, hojas.js y estilo.css, para que el navegador no mezcle una página nueva
      # con datos viejos de su caché (Pages los guarda 10 minutos).
      - name: Marca de versión en los recursos
        run: sed -i -E "s/(src|href)=\"(datos\.js|hojas\.js|estilo\.css)\"/\1=\"\2?v=${GITHUB_SHA::7}\"/" maqueta/*.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: maqueta

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
